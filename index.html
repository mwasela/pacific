<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pacific Parking - Payment System</title>

    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            backdrop-filter: blur(15px);
            box-shadow: 0 15px-35px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin: 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .highlight {
            color: #00d4ff;
        }

        p {
            font-size: 1rem;
            opacity: 0.8;
            margin-bottom: 25px;
        }

        /* Form Elements */
        .step {
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        .step.active {
            display: block;
        }

        input {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: none;
            background: #00d4ff;
            color: #0f2027;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #00b8e6;
            transform: translateY(-2px);
        }

        /* Toast Notification */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: #28a745;
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px;
            position: fixed;
            z-index: 1;
            bottom: 30px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        #toast.show {
            visibility: visible;
            animation: fadein 0.5s, fadeout 0.5s 2.5s;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadein {
            from {
                bottom: 0;
                opacity: 0;
            }

            to {
                bottom: 30px;
                opacity: 1;
            }
        }

        @keyframes fadeout {
            from {
                bottom: 30px;
                opacity: 1;
            }

            to {
                bottom: 0;
                opacity: 0;
            }
        }

        .loader {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid #00d4ff;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <input type="text" id="website_hp" style="display:none !important" tabindex="-1" autocomplete="off">
            <h1>Welcome to <span class="highlight">Pacific</span></h1>
            <p>Enter details to proceed with parking</p>
            <input type="text" id="plateNumber" placeholder="Vehicle Plate Number (e.g. KAA 001A)">
            <input type="tel" id="phoneNumber" placeholder="M-Pesa Phone Number (07...)">
            <button onclick="submitDetails()">Proceed to Pay</button>
        

        <div id="step2" class="step">
            <div class="loader"></div>
            <h2>Processing Payment</h2>
            <p>Please enter your <b>M-Pesa PIN</b> on the prompt sent to your phone.</p>
        </div>

        <div id="step3" class="step">
            <h1 style="color: #28a745;">✔ Payment Submitted</h1>
            <p>Payment Submitted, Wait for the barrier to open.</p>
            <div class="badge"
                style="border-color: #28a745; color: #28a745; padding: 10px 20px; border: 2px solid; border-radius: 30px;">
                Access Granted</div>
        </div>

        <footer>
            © 2026 Pacific Parking.
        </footer>
    </div>

    <div id="toast">Barrier Opening... Drive Safe!</div>

    <script>
        async function submitDetails() {
            // 1. Honeypot check: If this hidden field is filled, it's a bot.
            const botField = document.getElementById('website_hp').value;
            if (botField) {
                console.warn("Bot detected.");
                return;
            }

            const plate = document.getElementById('plateNumber').value.trim().toUpperCase();
            const phone = document.getElementById('phoneNumber').value.trim();

            // 2. Basic Validation
            if (!plate || !phone) {
                alert("Please fill in all fields.");
                return;
            }

            // 3. Kenyan Phone Validation (Regex for 07... or 01... or 254...)
            const phoneRegex = /^(?:254|\+254|0)?(7|1)(?:[0-9]){8}$/;
            if (!phoneRegex.test(phone)) {
                alert("Please enter a valid M-Pesa number (e.g., 0712345678).");
                return;
            }

            // Switch to Processing UI
            showStep(2);

            try {
                const response = await fetch('http://localhost:3000/payment/pay', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Requested-With': 'XMLHttpRequest' // Helps backend identify AJAX
                    },
                    body: JSON.stringify({
                        number_plate: plate,
                        phone_number: phone,
                        timestamp: new Date().toISOString()
                    })
                });

                // We assume a 200 OK starts the M-Pesa push
                if (response.ok) {
                    setTimeout(() => {
                        showStep(3);
                        showToast();
                    }, 4000); // 4 seconds delay to simulate user entering PIN
                } else {
                    throw new Error("Server responded with an error.");
                }

            } catch (error) {
                console.error('Error:', error);
                alert("Something went wrong. Please check your connection and try again.");
                showStep(1);
            }
        }

        function showStep(stepNum) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + stepNum).classList.add('active');
        }

        function showToast() {
            var x = document.getElementById("toast");
            x.className = "show";
            setTimeout(function () { x.className = x.className.replace("show", ""); }, 3000);
        }
    </script>

</body>

</html>
